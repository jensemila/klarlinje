<!doctype html>
<html lang="nb" data-theme="natt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Du er på listen · Klarlinje</title>
  <meta name="description" content="Du er på listen for Klarlinje dagsretreat. Vi gir deg beskjed når påmelding åpner våren 2027." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-H027E3MZYE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-H027E3MZYE');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,200;1,6..72,300;1,6..72,400;1,6..72,500&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg:         #0f1311;
      --bg-soft:    #151a17;
      --ink:        #ece3d2;
      --ink-soft:   #c8c0ad;
      --ink-mute:   #847d6e;
      --line:       rgba(236, 227, 210, 0.10);
      --accent:     #c89149;
      --accent-2:   #d9a86a;
      --accent-soft:rgba(200, 145, 73, 0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 16.5px;
      line-height: 1.55;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    em.editorial {
      font-family: "Newsreader", serif;
      font-style: italic;
      font-weight: 300;
    }

    p { margin: 0; }
    a { color: inherit; text-decoration: none; }

    .label {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 400;
    }

    /* Nav */
    .nav {
      padding: 22px 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Newsreader", serif;
      font-style: italic;
      font-size: 21px;
    }

    .nav-brand-mark {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    /* Main */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.15s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .card {
      max-width: 560px;
      text-align: center;
      width: 100%;
    }

    .check {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 36px;
      color: var(--accent);
      font-size: 24px;
    }

    .card .label {
      display: block;
      margin-bottom: 32px;
    }

    h1 {
      font-family: "Newsreader", serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(56px, 9vw, 120px);
      line-height: 0.94;
      letter-spacing: -0.035em;
      font-variation-settings: "opsz" 144;
      color: var(--ink);
      margin: 0 0 40px;
    }

    .line {
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin: 0 auto 40px;
      opacity: 0.5;
    }

    .lead {
      color: var(--ink-soft);
      font-size: 17px;
      line-height: 1.7;
      max-width: 38ch;
      margin: 0 auto 40px;
    }

    .signature {
      font-family: "Newsreader", serif;
      font-style: italic;
      font-size: 22px;
      color: var(--ink);
      margin-top: 36px;
    }

    .back {
      margin-top: 56px;
    }

    .back a {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-mute);
      transition: color 0.2s;
    }

    .back a:hover { color: var(--accent); }

    /* Footer */
    footer {
      padding: 32px 44px;
      border-top: 1px solid var(--line);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-mute);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    @media (max-width: 540px) {
      .nav { padding: 18px 20px; }
      .nav-brand { font-size: 18px; }
      footer { padding: 28px 20px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-brand">
      <span class="nav-brand-mark"></span>
      <span><em>Klarlinje</em></span>
    </a>
  </nav>

  <main>
    <div class="card">
      <div class="check">✓</div>

      <span class="label">Dagsretreat · Bekreftet</span>

      <h1>Du er på listen.</h1>

      <div class="line"></div>

      <p class="lead">
        Vi gir deg beskjed når påmelding åpner våren 2027. Ingenting i mellomtiden.
      </p>

      <p class="signature">Jens</p>

      <p class="back">
        <a href="index.html">← Tilbake til Klarlinje</a>
      </p>
    </div>
  </main>

  <footer>
    <div>© 2026 Klarlinje · Oslo</div>
    <div>
      <a href="mailto:jens@klarlinje.no" style="color: inherit;">jens@klarlinje.no</a>
    </div>
  </footer>

</body>
</html>
