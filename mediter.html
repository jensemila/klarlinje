<!doctype html>
<html lang="nb" data-theme="natt">
<head>
  <meta charset="utf-8" />

  <meta name="robots" content="noindex, nofollow" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-H027E3MZYE"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,200;1,6..72,300;1,6..72,400;1,6..72,500&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"

  <style>
    :root {
      --bg:#0f1311; --bg-soft:#151a17; --paper:#1b211d;
      --ink:#ece3d2; --ink-soft:#c8c0ad; --ink-mute:#847d6e;
      --line:rgba(236,227,210,0.10);
      --accent:#c89149; --accent-2:#d9a86a; --accent-ink:#0f1311;
    }
    * { box-sizing: border-box; }
    html, body {
      margin:0; padding:0; background:var(--bg); color:var(--ink);
      font-family:"Outfit", system-ui, sans-serif; font-size:16.5px; line-height:1.55;
      font-weight:300; -webkit-font-smoothing:antialiased; min-height:100dvh;
      display:flex; flex-direction:column;
    }
    em.editorial { font-family:"Newsreader", serif; font-style:italic; font-weight:300; }
    a { color:inherit; text-decoration:none; }

    .nav {
      padding:22px 44px; display:flex; align-items:center;
      border-bottom:1px solid var(--line);
    }
    .nav-brand {
      display:flex; align-items:center; gap:12px;
      font-family:"Newsreader", serif; font-style:italic; font-size:21px;
    }
    .nav-brand-mark { width:9px; height:9px; border-radius:50%; background:var(--accent); display:inline-block; }

    main {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding:80px 24px;
    }

    .wrap {
      max-width:640px; width:100%; text-align:center;
      opacity:0; animation:fade 1s ease-out 0.15s forwards;
    }
    @keyframes fade { to { opacity:1; } }

    .label {
      font-family:"JetBrains Mono", monospace; font-size:11px; letter-spacing:0.22em;
      text-transform:uppercase; color:var(--accent); font-weight:400;
      display:block; margin-bottom:28px;
    }

    h1 {
      font-family:"Newsreader", serif; font-weight:300; font-style:italic;
      font-size:clamp(40px, 7vw, 72px); line-height:1.0; letter-spacing:-0.03em;
      font-variation-settings:"opsz" 96; color:var(--ink); margin:0 0 28px;
    }

    .lead {
      color:var(--ink-soft); font-size:17px; line-height:1.7;
      max-width:38ch; margin:0 auto 48px;
    }

    .video-wrap {
      position:relative; width:100%; padding-bottom:56.25%;
      border-radius:10px; overflow:hidden;
      border:1px solid var(--line); margin-bottom:48px;
      background:var(--paper);
    }
    .video-wrap iframe {
      position:absolute; inset:0; width:100%; height:100%; border:none;
    }

    .hint {
      font-family:"Newsreader", serif; font-style:italic;
      font-size:15px; color:var(--ink-mute); line-height:1.7;
      max-width:34ch; margin:0 auto 48px;
    }

    .onward {
      padding-top:32px; border-top:1px solid var(--line);
      display:inline-flex; flex-direction:column; gap:12px; align-items:center;
    }
    .onward a {
      font-family:"Newsreader", serif; font-size:17px; color:var(--ink-soft);
      transition:color 0.2s; display:inline-flex; align-items:center; gap:8px;
    }
    .onward a:hover { color:var(--accent); }
    .onward .arr { color:var(--accent); font-family:"Outfit",sans-serif; }

    footer {
      padding:32px 44px; border-top:1px solid var(--line);
      font-family:"JetBrains Mono", monospace; font-size:11px; letter-spacing:0.12em;
      text-transform:uppercase; color:var(--ink-mute);
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;
    }
    footer a:hover { color:var(--accent); }

    @media (max-width:600px) {
      .nav { padding:18px 20px; }
      .nav-brand { font-size:18px; }
      main { padding:60px 20px; }
      footer { padding:28px 20px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-brand">
      <span class="nav-brand-mark"></span>
      <span><em>Klarlinje</em></span>
    </a>
  </nav>

  <main>
    <div class="wrap">
      <span class="label">Guidet meditasjon · 5 minutter</span>
      <h1>Klar for fem <em class="editorial">stille minutter?</em></h1>
      <p class="lead">
        Finn et rolig sted. Sett deg ned. Trykk play når du er klar.
      </p>

      <div class="video-wrap">
        <iframe
          src="https://www.youtube.com/embed/ear6H4s8Ikw?rel=0&modestbranding=1"
          title="5 minutter guidet meditasjon med Jens Asp"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>

      <p class="hint">Ingen forkunnskaper. Ingen app. Bare du og pusten din.</p>

      <div class="onward">
        <a href="kunnskap/">Les mer om meditasjon <span class="arr">→</span></a>
        <a href="index.html">Tilbake til Klarlinje <span class="arr">→</span></a>
      </div>
    </div>
  </main>

  <footer>
    <div>© 2026 Klarlinje · Oslo / Son</div>
    <div><a href="index.html">← Tilbake til Klarlinje</a></div>
  </footer>

</body>
</html>
