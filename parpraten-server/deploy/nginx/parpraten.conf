# Parpraten. Reverse proxy mot 127.0.0.1:3001
#
# MERK: certbot skriver TLS-blokka inn i denne fila på serveren. Siden deploy.sh
# rsyncer fila hver gang, må du etter FØRSTE certbot-kjøring hente den endrede
# fila tilbake hit, ellers overskriver neste utrulling sertifikatoppsettet:
#
#   scp -i ~/.ssh/mediemonitor_hetzner \
#     root@167.233.142.138:/etc/nginx/sites-available/parpraten.conf \
#     deploy/nginx/parpraten.conf

server {
    server_name parpraten.no www.parpraten.no;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Svarene strømmes ord for ord. Uten dette holder nginx igjen
        # teksten og chatten kommer i ett jafs til slutt.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/parpraten.no/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/parpraten.no/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.parpraten.no) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = parpraten.no) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name parpraten.no www.parpraten.no;
    return 404; # managed by Certbot




}